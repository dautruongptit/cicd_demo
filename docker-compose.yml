services:
  demo-cicd:
    image: ${IMAGE_NAME}
    container_name: demo-cicd
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      TZ: ${TZ}
    volumes:
      - app-logs:/app/logs
    networks:
      - shared-network
    restart: unless-stopped

volumes:
  app-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/app-logs

networks:
  shared-network:
    external: true