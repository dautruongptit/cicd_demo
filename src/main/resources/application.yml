spring:
  application:
    name: demo-app

  # Profile mặc định khi không set gì
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

server:
  port: 8082
  # Graceful shutdown — chờ request đang xử lý hoàn tất
  shutdown: graceful

# ── Actuator (base — profile override nếu cần) ──
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ── App info (hiện trong /actuator/info) ────────
info:
  app:
    name: ${spring.application.name}
    description: Spring Boot Demo — Employee CRUD API
    version: 1.0.0
