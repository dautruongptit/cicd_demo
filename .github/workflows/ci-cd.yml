name: CI/CD Pipeline

# ─────────────────────────────────────────────
# Trigger
# ─────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─────────────────────────────────────────────
# Global env
# ─────────────────────────────────────────────
env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/demo-cicd

jobs:
  # ══════════════════════════════════════════
  # Job 1 — Build & Test
  # ══════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests first to cache)
        run: mvn clean package -DskipTests -B

      - name: Run unit tests
        run: mvn test -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════
  # Job 2 — Build Docker Image & Push to Hub
  # ══════════════════════════════════════════
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # Chỉ chạy khi push lên main (không chạy trên PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag bằng full commit SHA + latest
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          # Tận dụng GitHub Actions cache → build nhanh hơn
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════
  # Job 3 — Deploy to VPS via SSH
  # ══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code (để lấy docker-compose.yml nếu cần)
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # ── 1. Vào thư mục project trên VPS ──────────────
            cd /media/mos/Data2/DeployUbuntu/cicd_demo

            # ── 2. Cập nhật IMAGE_NAME trong .env ────────────
            NEW_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/demo-cicd:${{ github.sha }}"
            sed -i "s|IMAGE_NAME=.*|IMAGE_NAME=${NEW_IMAGE}|" .env
            echo "✅ IMAGE_NAME updated → ${NEW_IMAGE}"

            # ── 3. Pull image mới & restart container ─────────
            docker compose pull
            docker compose up -d --remove-orphans
            echo "✅ Containers restarted"

            # ── 4. Dọn image cũ không dùng ───────────────────
            docker image prune -f

            # ── 5. Kiểm tra trạng thái ───────────────────────
            sleep 8
            docker compose ps
            echo "✅ Deployment complete — ${{ github.sha }}"

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always() # Luôn chạy bước này dù deploy thành công hay thất bại
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} Deploy to VPS Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
